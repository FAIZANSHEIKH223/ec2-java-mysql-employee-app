
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmployeeHub Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f5f9;
            color: #202938;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 35px;
        }

        header h1 { font-size: 25px; }

        header p {
            margin-top: 7px;
            color: #cbd5e1;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        .card, .table-card {
            background: white;
            padding: 23px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .card p { color: #64748b; font-size: 14px; }

        .card h2 {
            margin-top: 12px;
            font-size: 28px;
            color: #1d4ed8;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        input {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        #search { width: 260px; max-width: 100%; }

        button {
            padding: 11px 17px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary { background: #2563eb; color: white; }
        .primary:hover { background: #1d4ed8; }
        .edit { background: #e0e7ff; color: #1d4ed8; margin-right: 5px; }
        .delete { background: #fee2e2; color: #b91c1c; }

        .table-card { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th, td {
            text-align: left;
            padding: 15px 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            color: #64748b;
            font-size: 13px;
            text-transform: uppercase;
        }

        td { font-size: 14px; }

        .message {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 7px;
            display: none;
        }

        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #dcfce7; color: #166534; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
        }

        .modal-content h2 { margin-bottom: 20px; }

        .modal-content input {
            width: 100%;
            margin-bottom: 13px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .cancel { background: #e5e7eb; color: #374151; }

        #emptyMessage {
            text-align: center;
            padding: 25px;
            color: #64748b;
            display: none;
        }

        @media (max-width: 600px) {
            header { padding: 20px; }
            .toolbar { align-items: stretch; flex-direction: column; }
            #search, .toolbar button { width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <h1>EmployeeHub</h1>
    <p>Employee Management Dashboard</p>
</header>

<main>
    <div id="message" class="message"></div>

    <section class="stats">
        <div class="card">
            <p>Total Employees</p>
            <h2 id="totalEmployees">0</h2>
        </div>
        <div class="card">
            <p>Departments</p>
            <h2 id="totalDepartments">0</h2>
        </div>
        <div class="card">
            <p>Average Salary</p>
            <h2 id="averageSalary">₹0</h2>
        </div>
    </section>

    <section class="toolbar">
        <input type="text" id="search"
               placeholder="Search employees..."
               oninput="renderEmployees()">
        <button class="primary" onclick="openAddModal()">
            + Add Employee
        </button>
    </section>

    <section class="table-card">
        <h2 style="margin-bottom: 18px;">Employee Directory</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="employeeTable"></tbody>
        </table>
        <p id="emptyMessage">No employees found.</p>
    </section>
</main>

<div class="modal" id="employeeModal">
    <div class="modal-content">
        <h2 id="modalTitle">Add Employee</h2>

        <form id="employeeForm">
            <input type="hidden" id="employeeId">
            <input type="text" id="name"
                   placeholder="Employee Name" required>
            <input type="email" id="email"
                   placeholder="Email Address" required>
            <input type="text" id="department"
                   placeholder="Department" required>
            <input type="number" id="salary"
                   placeholder="Annual Salary"
                   min="0" step="0.01" required>

            <div class="modal-actions">
                <button type="button" class="cancel"
                        onclick="closeModal()">Cancel</button>
                <button type="submit" class="primary">
                    Save Employee
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    let employees = [];
    const API_URL = "/api/employees";

    async function loadEmployees() {
        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Unable to load employees.");
            }

            employees = await response.json();
            renderEmployees();
            updateStats();
        } catch (error) {
            showMessage(error.message, "error");
        }
    }

    function renderEmployees() {
        const table = document.getElementById("employeeTable");
        const search = document.getElementById("search").value.toLowerCase();

        table.innerHTML = "";

        const filtered = employees.filter(employee =>
            String(employee.name || "").toLowerCase().includes(search) ||
            String(employee.email || "").toLowerCase().includes(search) ||
            String(employee.department || "").toLowerCase().includes(search)
        );

        document.getElementById("emptyMessage").style.display =
            filtered.length === 0 ? "block" : "none";

        filtered.forEach(employee => {
            const row = document.createElement("tr");

            const values = [
                employee.id,
                employee.name,
                employee.email,
                employee.department,
                "₹" + Number(employee.salary).toLocaleString("en-IN", {
                    maximumFractionDigits: 2
                })
            ];

            values.forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            const actions = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.className = "edit";
            editButton.textContent = "Edit";
            editButton.addEventListener("click", () =>
                openEditModal(employee.id)
            );

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete";
            deleteButton.textContent = "Delete";
            deleteButton.addEventListener("click", () =>
                deleteEmployee(employee.id)
            );

            actions.appendChild(editButton);
            actions.appendChild(deleteButton);
            row.appendChild(actions);
            table.appendChild(row);
        });
    }

    function updateStats() {
        const total = employees.length;
        const departments = new Set(
            employees.map(employee => employee.department)
        );

        const totalSalary = employees.reduce(
            (sum, employee) => sum + Number(employee.salary || 0), 0
        );

        const average = total > 0 ? totalSalary / total : 0;

        document.getElementById("totalEmployees").textContent = total;
        document.getElementById("totalDepartments").textContent =
            departments.size;
        document.getElementById("averageSalary").textContent =
            "₹" + average.toLocaleString("en-IN", {
                maximumFractionDigits: 2
            });
    }

    function openAddModal() {
        document.getElementById("employeeForm").reset();
        document.getElementById("employeeId").value = "";
        document.getElementById("modalTitle").textContent = "Add Employee";
        document.getElementById("employeeModal").style.display = "flex";
    }

    function openEditModal(id) {
        const employee = employees.find(item => item.id === id);
        if (!employee) return;

        document.getElementById("employeeId").value = employee.id;
        document.getElementById("name").value = employee.name;
        document.getElementById("email").value = employee.email;
        document.getElementById("department").value = employee.department;
        document.getElementById("salary").value = employee.salary;

        document.getElementById("modalTitle").textContent = "Edit Employee";
        document.getElementById("employeeModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("employeeModal").style.display = "none";
    }

    document.getElementById("employeeForm").addEventListener(
        "submit", async function(event) {
            event.preventDefault();

            const id = document.getElementById("employeeId").value;

            const employee = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                department: document.getElementById("department").value.trim(),
                salary: Number(document.getElementById("salary").value)
            };

            const url = id ? `${API_URL}/${id}` : API_URL;
            const method = id ? "PUT" : "POST";

            try {
                const response = await fetch(url, {
                    method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(employee)
                });

                if (!response.ok) {
                    const body = await response.json().catch(() => ({}));
                    throw new Error(body.detail || body.message ||
                        `Unable to save employee (HTTP ${response.status}).`);
                }

                closeModal();
                showMessage(
                    id ? "Employee updated successfully!" :
                         "Employee added successfully!",
                    "success"
                );
                await loadEmployees();
            } catch (error) {
                showMessage(error.message, "error");
            }
        }
    );

    async function deleteEmployee(id) {
        if (!confirm("Are you sure you want to delete this employee?")) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error(
                    `Unable to delete employee (HTTP ${response.status}).`
                );
            }

            showMessage("Employee deleted successfully!", "success");
            await loadEmployees();
        } catch (error) {
            showMessage(error.message, "error");
        }
    }

    function showMessage(message, type) {
        const box = document.getElementById("message");
        box.textContent = message;
        box.className = "message " + type;
        box.style.display = "block";

        setTimeout(() => {
            box.style.display = "none";
        }, 4000);
    }

    loadEmployees();
</script>

</body>
</html>
